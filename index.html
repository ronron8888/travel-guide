<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旅行のしおり"><title>旅のしおり</title><style>:root{--bg:#f6f4ef;--card:#fff;--text:#242424;--muted:#777;--accent:#486a5a;--line:#e8e3d9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7}a{color:inherit}.hero{min-height:55vh;display:flex;align-items:end;padding:32px 20px;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.58)),url('assets/hero.jpg') center/cover;color:#fff}.hero-inner{width:min(900px,100%);margin:auto}.eyebrow{letter-spacing:.12em;font-size:.8rem;opacity:.85}.hero h1{font-size:clamp(2.2rem,8vw,4.8rem);line-height:1.1;margin:.25em 0}.hero p{margin:0}.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow:auto}.navin{width:min(900px,100%);margin:auto;display:flex;gap:5px;padding:10px 14px}.nav a{white-space:nowrap;text-decoration:none;padding:7px 11px;border-radius:999px}.nav a:hover{background:var(--bg)}main{width:min(900px,100%);margin:auto;padding:28px 16px 70px}.section{margin:34px 0}.section h2{font-size:1.5rem;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.event{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.06)}.timeline{display:grid;gap:12px}.time{display:grid;grid-template-columns:72px 1fr;gap:14px}.time>strong{color:var(--accent)}.meta{color:var(--muted);font-size:.9rem}.button{display:inline-block;margin-top:10px;padding:8px 12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:9px}.check{display:flex;gap:10px;padding:7px 0}.check input{width:18px;height:18px;margin-top:5px}.footer{text-align:center;color:var(--muted);padding:20px}@media(max-width:560px){.hero{min-height:48vh}.time{grid-template-columns:56px 1fr}}</style></head><body><header class="hero"><div class="hero-inner"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="dates"></p></div></header><nav class="nav"><div class="navin"><a href="#overview">概要</a><a href="#schedule">旅程</a><a href="#stay">宿泊</a><a href="#food">食事</a><a href="#packing">持ち物</a><a href="#contacts">連絡先</a></div></nav><main><section class="section" id="overview"><h2>旅の概要</h2><div class="grid" id="overviewGrid"></div></section><section class="section" id="schedule"><h2>スケジュール</h2><div class="timeline" id="scheduleList"></div></section><section class="section" id="stay"><h2>宿泊</h2><div class="grid" id="stayGrid"></div></section><section class="section" id="food"><h2>食事・スポット</h2><div class="grid" id="foodGrid"></div></section><section class="section" id="packing"><h2>持ち物</h2><div class="card" id="packingList"></div></section><section class="section" id="contacts"><h2>連絡先</h2><div class="grid" id="contactGrid"></div></section></main><div class="footer">楽しい旅になりますように。</div><script src="data.js"></script><script>const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));$('eyebrow').textContent=travel.eyebrow;$('title').textContent=travel.title;$('dates').textContent=travel.dates;$('overviewGrid').innerHTML=travel.overview.map(x=>`<div class="card"><div class="meta">${e(x.label)}</div><strong>${e(x.value)}</strong></div>`).join('');$('scheduleList').innerHTML=travel.schedule.map(x=>`<div class="time"><strong>${e(x.time)}</strong><div class="event"><strong>${e(x.title)}</strong><div>${e(x.description)}</div>${x.map?`<a class="button" href="${e(x.map)}" target="_blank" rel="noopener">地図を見る</a>`:''}</div></div>`).join('');$('stayGrid').innerHTML=travel.stay.map(x=>`<div class="card"><strong>${e(x.name)}</strong><div class="meta">${e(x.note)}</div>${x.map?`<a class="button" href="${e(x.map)}" target="_blank" rel="noopener">地図を見る</a>`:''}</div>`).join('');$('foodGrid').innerHTML=travel.food.map(x=>`<div class="card"><strong>${e(x.name)}</strong><div class="meta">${e(x.note)}</div>${x.url?`<a class="button" href="${e(x.url)}" target="_blank" rel="noopener">詳細を見る</a>`:''}</div>`).join('');$('packingList').innerHTML=travel.packing.map(x=>`<label class="check"><input type="checkbox"><span>${e(x)}</span></label>`).join('');$('contactGrid').innerHTML=travel.contacts.map(x=>`<div class="card"><div class="meta">${e(x.label)}</div><strong>${e(x.value)}</strong></div>`).join('');</script></body></html>
