<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旅のしおり"><title>旅のしおり</title>
<style>
:root{--ink:#171714;--cream:#f4f0e8;--paper:#fffdf8;--sand:#d8c8ae;--gold:#a48654;--muted:#777268;--line:#ddd5c7;--serif:Georgia,"Times New Roman","Yu Mincho",serif;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.8}a{color:inherit}.hero{min-height:92svh;position:relative;display:flex;align-items:end;overflow:hidden;color:#fff;background:#333 url('assets/hero.jpg') center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%)}.hero-inner{position:relative;z-index:1;width:min(1100px,100%);margin:auto;padding:34px 22px 56px}.kicker{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase}.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,10vw,7.2rem);line-height:.98;margin:16px 0}.hero p{font-size:.95rem;letter-spacing:.12em}.scroll{position:absolute;right:22px;bottom:30px;z-index:2;font-size:.7rem;writing-mode:vertical-rl;letter-spacing:.2em}.nav{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.navin{width:min(1100px,100%);margin:auto;display:flex;gap:2px;padding:11px 16px;overflow:auto}.nav a{white-space:nowrap;text-decoration:none;font-size:.78rem;letter-spacing:.06em;padding:8px 13px}.nav a:hover{background:#e9e2d5;border-radius:99px}main{width:min(1100px,100%);margin:auto;padding:60px 20px 90px}.intro{display:grid;grid-template-columns:1fr 2fr;gap:50px;align-items:start;margin-bottom:90px}.label{font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}h2{font-family:var(--serif);font-size:clamp(2rem,4vw,3.2rem);font-weight:400;line-height:1.15;margin:8px 0 22px}.lead{font-size:1.05rem;color:#4d4a44}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);padding:24px;min-height:120px}.card .meta{font-size:.72rem;color:var(--muted);letter-spacing:.08em}.card strong{font-size:1.05rem}.section{margin:0 0 100px}.day-title{display:flex;align-items:end;gap:20px;border-bottom:1px solid var(--ink);padding-bottom:15px;margin-bottom:25px}.day-title .num{font-family:var(--serif);font-size:3.5rem;line-height:.8}.day-title h3{margin:0;font-family:var(--serif);font-size:1.7rem;font-weight:400}.timeline{display:grid;gap:0}.time{display:grid;grid-template-columns:90px 1fr;gap:22px;border-bottom:1px solid var(--line);padding:22px 0}.time>strong{font-family:var(--serif);font-size:1.15rem;font-weight:400}.event{background:var(--paper);padding:22px 24px}.event-title{font-family:var(--serif);font-size:1.25rem}.meta{color:var(--muted);font-size:.82rem}.button{display:inline-block;margin-top:13px;border-bottom:1px solid var(--gold);text-decoration:none;padding-bottom:2px;font-size:.78rem;letter-spacing:.05em}.spot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.spot{background:var(--paper);padding:0 0 20px}.spot-img{height:220px;background:linear-gradient(135deg,#d7cbb9,#eee8de);background-position:center;background-size:cover}.spot-body{padding:20px 22px}.spot h3{font-family:var(--serif);font-size:1.35rem;font-weight:400;margin:0 0 5px}.packing{display:grid;grid-template-columns:1fr 2fr;gap:40px}.check{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.check input{accent-color:#7d6b4f;width:18px;height:18px;margin-top:5px}.quote{font-family:var(--serif);font-size:1.8rem;line-height:1.45;padding:25px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}footer{text-align:center;padding:55px 20px;background:#1c1b18;color:#eee8dd;font-family:var(--serif);font-size:1.1rem}.footer-small{font-family:var(--sans);font-size:.65rem;letter-spacing:.2em;opacity:.5;margin-top:10px}@media(max-width:700px){main{padding:42px 16px 70px}.intro,.packing{grid-template-columns:1fr;gap:20px}.grid,.spot-grid{grid-template-columns:1fr}.section{margin-bottom:75px}.time{grid-template-columns:55px 1fr;gap:10px}.event{padding:17px}.hero{min-height:82svh}.hero h1{font-size:clamp(3rem,15vw,5rem)}}
</style></head>
<body>
<header class="hero"><div class="hero-inner"><div class="kicker" id="eyebrow"></div><h1 id="title"></h1><p id="dates"></p></div><div class="scroll">SCROLL</div></header>
<nav class="nav"><div class="navin"><a href="#overview">ABOUT</a><a href="#schedule">ITINERARY</a><a href="#stay">STAY</a><a href="#food">SPOTS</a><a href="#packing">PACKING</a><a href="#contacts">CONTACT</a></div></nav>
<main>
<section class="intro" id="overview"><div><div class="label">About the trip</div><h2>旅の概要</h2></div><div><p class="lead">この旅のための、みんなのしおり。予定を確認しながら、旅そのものも楽しもう。</p><div class="grid" id="overviewGrid"></div></div></section>
<section class="section" id="schedule"><div class="day-title"><span class="num">01</span><h3>ITINERARY / スケジュール</h3></div><div class="timeline" id="scheduleList"></div></section>
<section class="section" id="stay"><div class="label">Stay</div><h2>宿泊</h2><div class="grid" id="stayGrid"></div></section>
<section class="section" id="food"><div class="label">Places & Food</div><h2>食事・スポット</h2><div class="spot-grid" id="foodGrid"></div></section>
<section class="section" id="packing"><div><div class="label">Checklist</div><h2>持ち物</h2></div><div class="packing"><div><p class="quote">忘れ物より、<br>思い出をたくさん。</p></div><div class="card" id="packingList"></div></div></section>
<section class="section" id="contacts"><div class="label">Contact</div><h2>連絡先</h2><div class="grid" id="contactGrid"></div></section>
</main><footer>Have a wonderful journey.<div class="footer-small">TRAVEL GUIDE</div></footer>
<script src="data.js"></script><script>const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));$('eyebrow').textContent=travel.eyebrow;$('title').textContent=travel.title;$('dates').textContent=travel.dates;$('overviewGrid').innerHTML=travel.overview.map(x=>`<div class="card"><div class="meta">${e(x.label)}</div><strong>${e(x.value)}</strong></div>`).join('');$('scheduleList').innerHTML=travel.schedule.map(x=>`<div class="time"><strong>${e(x.time)}</strong><div class="event"><div class="event-title">${e(x.title)}</div><div class="meta">${e(x.description)}</div>${x.map?`<a class="button" href="${e(x.map)}" target="_blank" rel="noopener">VIEW ON MAP →</a>`:''}</div></div>`).join('');$('stayGrid').innerHTML=travel.stay.map(x=>`<div class="card"><div class="meta">HOTEL</div><strong>${e(x.name)}</strong><div class="meta">${e(x.note)}</div>${x.map?`<a class="button" href="${e(x.map)}" target="_blank" rel="noopener">VIEW ON MAP →</a>`:''}</div>`).join('');$('foodGrid').innerHTML=travel.food.map(x=>`<article class="spot"><div class="spot-img"></div><div class="spot-body"><h3>${e(x.name)}</h3><div class="meta">${e(x.note)}</div>${x.url?`<a class="button" href="${e(x.url)}" target="_blank" rel="noopener">DETAILS →</a>`:''}</div></article>`).join('');$('packingList').innerHTML=travel.packing.map(x=>`<label class="check"><input type="checkbox"><span>${e(x)}</span></label>`).join('');$('contactGrid').innerHTML=travel.contacts.map(x=>`<div class="card"><div class="meta">${e(x.label)}</div><strong>${e(x.value)}</strong></div>`).join('');</script>
</body></html>
